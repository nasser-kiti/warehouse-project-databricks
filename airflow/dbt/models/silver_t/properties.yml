models:
    - name: products_t
      columns:
        - name: product_id
          data_tests:
            - not_null
            - unique
        - name: product_name
          data_tests:
            - not_null
        - name: price
          data_tests:
            - not_null
            - dbt_utils.expression_is_true:
                arguments:
                  expression: " > 0"


    - name: orders_t
      columns:
        - name: order_id
          data_tests:
            - not_null
            - unique